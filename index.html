<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chip's First App</title>
    <style>
      /* Simple, readable page layout */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
      }

      .app {
        text-align: center;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        margin: 0 0 1.5rem;
      }

      button {
        font-size: 1.1rem;
        padding: 0.75rem 1.25rem;
        border: 1px solid #333;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #efefef;
      }

      #issueText {
        margin-top: 1rem;
        font-size: 1rem;
        color: #222;
      }

      #checksLabel {
        margin-top: 0.75rem;
        font-weight: bold;
        color: #222;
      }

      #checksText {
        margin-top: 0.35rem;
        color: #333;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Chip's First App</h1>
      <button id="clickButton" type="button">Click Me</button>
      <p id="issueText" aria-live="polite"></p>
      <p id="checksLabel" aria-live="polite"></p>
      <p id="checksText" aria-live="polite"></p>
    </main>

    <script>
      // Root cause: the click handler only showed a fixed alert and never captured user input.
      // Fix: prompt for the machine issue, then render the entered text in the page.
      document
        .getElementById("clickButton")
        .addEventListener("click", function () {
          const issue = prompt("Enter machine issue:");
          const issueText = document.getElementById("issueText");
          const checksLabel = document.getElementById("checksLabel");
          const checksText = document.getElementById("checksText");

          if (issue === null) {
            issueText.textContent = "No issue entered.";
            checksLabel.textContent = "";
            checksText.textContent = "";
            return;
          }

          const trimmedIssue = issue.trim();

          issueText.textContent = trimmedIssue
            ? `Machine issue: ${trimmedIssue}`
            : "Machine issue: (empty)";

          checksLabel.textContent = "Suggested checks:";
          checksText.textContent =
            trimmedIssue.toLowerCase() === "pump"
              ? "Check power, check prime, check blockage"
              : "General inspection required";
        });
    </script>
  </body>
</html>
