<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chip's First App</title>
    <style>
      /* Simple, readable page layout */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
      }

      .app {
        text-align: center;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        margin: 0 0 1.5rem;
      }

      button {
        font-size: 1.1rem;
        padding: 0.75rem 1.25rem;
        border: 1px solid #333;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #efefef;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Chip's First App</h1>
      <button type="button">Click Me</button>
    </main>
  </body>
</html>
